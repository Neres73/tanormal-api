# Oracle da FIAP. Usuário e senha vêm de variáveis de ambiente (nunca coloque a senha aqui).
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Cria/atualiza as tabelas TN_* automaticamente. Se o grupo preferir rodar o DDL do Database Design, troque para "validate".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Pool pequeno: o Oracle da FIAP limita conexões por aluno
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
