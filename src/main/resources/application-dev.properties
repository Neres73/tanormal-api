# Banco em memória: some ao parar a aplicação. Console em /h2-console (JDBC URL abaixo, usuário sa, sem senha)
spring.datasource.url=jdbc:h2:mem:tanormal;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
