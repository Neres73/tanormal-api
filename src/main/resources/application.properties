spring.application.name=tanormal-api

# Perfil padrão: dev (H2 em memória). Para usar o Oracle da FIAP: SPRING_PROFILES_ACTIVE=oracle
spring.profiles.default=dev

# O Render informa a porta pela variável PORT
server.port=${PORT:8080}

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Cadastra linhas, estações e um trajeto de demonstração se o banco estiver vazio
tanormal.carga-inicial=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
